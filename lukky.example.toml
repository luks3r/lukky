# Copy to lukky.toml. Keep secrets out of this file: put them in .env.
# Environment variables override these values, for example
# TWITCH_CHANNELS="a,b" or LUKKY_GREETER_INTERVAL="5m".

[log]
level = "info" # debug, info, warn, error

[twitch]
# Channel logins to join. Twitch is enabled by TWITCH_CLIENT_ID in .env.
channels = []

[greeter]
interval = "2m" # console reminder; "0s" disables it

[overlay]
# Overlay pages for OBS browser sources: http://127.0.0.1:7878/
# Keep this on 127.0.0.1: the pages and their data have no authentication.
address = "127.0.0.1:7878" # "" disables overlays

[lua]
dir = "scripts" # one subdirectory with an init.lua per module
# max_instructions = 10000000 # per callback
